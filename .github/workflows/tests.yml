name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: scanner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every matrix leg even if one fails, so a Linux-only or macOS-only
      # regression is visible in the same run instead of masking the other.
      fail-fast: false
      matrix:
        include:
          # GNU userland + bash 5.x
          - os: ubuntu-latest
            locale: C.UTF-8
          # BSD userland + bash 3.2 — the primary target platform. Validates
          # the "bash 3.2+ / cross-platform" claim in README.
          - os: macos-latest
            locale: en_US.UTF-8
    env:
      # The scanner normalizes Unicode confusables (Cyrillic, fullwidth, CJK)
      # via sed/perl. A non-UTF-8 locale (CI default is often C/POSIX) can
      # corrupt multibyte handling — the same class of gotcha as BSD-vs-GNU sed.
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runtime dependencies
        # Fail loudly with a clear message if a dependency is missing, rather
        # than letting the scanner emit a cryptic error mid-run. All of these
        # are preinstalled on GitHub-hosted ubuntu and macos runners.
        run: |
          for c in bash jq perl shasum base64 sed grep awk; do
            command -v "$c" >/dev/null || { echo "missing dependency: $c"; exit 1; }
          done
          bash --version | head -1

      - name: Run scanner test suite
        run: ./tests/run-tests.sh

      - name: Run command-helper test suite
        run: ./tests/run-cmd-tests.sh

      - name: Run egress guard test suite
        run: ./tests/run-egress-tests.sh

      - name: Run notification dispatcher test suite
        run: ./tests/run-notify-tests.sh

      - name: Run content-trust downgrade test suite
        run: ./tests/run-trust-tests.sh

      - name: Run multi-agent visibility test suite
        run: ./tests/run-agent-tests.sh

      - name: Run Bash-fetch scan test suite
        run: ./tests/run-bash-scan-tests.sh

      - name: Validate embedded Windows toast PowerShell (pwsh parser)
        # No Windows runner exists, so the WinRT toast can't run here — but the
        # runner-provided pwsh can parse-check the embedded script for SYNTAX
        # errors (a syntax error would silently break the toast on Windows).
        run: |
          command -v pwsh >/dev/null 2>&1 || { echo "pwsh not on runner; skipping"; exit 0; }
          awk "/-Command '/{f=1;next} /^' >/{f=0} f" scripts/web-safety-notify.sh > toast_block.ps1
          test -s toast_block.ps1 || { echo "FAIL: PowerShell block extraction empty"; exit 1; }
          pwsh -NoProfile -Command "\$e=\$null; [void][System.Management.Automation.Language.Parser]::ParseInput((Get-Content -Raw ./toast_block.ps1),[ref]\$null,[ref]\$e); if(\$e){\$e|ForEach-Object{Write-Host \$_.Message}; exit 1}; Write-Host 'OK: toast PowerShell parses cleanly'"
          rm -f toast_block.ps1

  engine:
    # The Rust engine is the production scanner authority (hooks/hooks.json
    # invokes engine/target/release/web-safety-engine). Build it exactly as an
    # operator's install does — pinned toolchain via rust-toolchain.toml,
    # locked dependencies — then hold it to the same gate as local dev.
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Build (release, locked — the install step operators run)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: End-to-end wiring probe (hooks.json command lines vs the Bash oracle)
        # Runs here rather than in the scanner job because it needs the release
        # binary this job just built. It is the only suite that tests the
        # WIRING — a green engine and a green oracle can still be wired
        # together wrongly, which is exactly how the 9.0.1 regressions shipped.
        working-directory: .
        run: ./tests/run-wiring-probe.sh
